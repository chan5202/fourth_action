name: Deployment
on:
  pull_request:
    types: [opened]
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Output event details
        run: echo "${{toJSON(github.event)}}"

      - name: Get Code
        uses: actions/checkout@v7
      - name: Install Dependencies
        run: npm ci
      - name: Lint Code
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Deploy code
        run: echo "deploying..."
